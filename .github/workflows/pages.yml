name: Refresh and deploy drama journal

on:
  push:
  schedule:
    - cron: '17 22 * * *' # 06:17 Asia/Shanghai; GitHub schedules may be delayed.
  workflow_dispatch:
    inputs:
      refresh_posters:
        description: Reanalyze all posters, including saved results
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and generate lockfile
        run: npm install --package-lock=true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install poster face detector
        run: python3 -m pip install 'opencv-python-headless<5'
      - name: Restore last successful snapshot
        uses: actions/cache/restore@v4
        with:
          path: public/data/dramas.json
          key: drama-snapshot-${{ github.run_id }}
          restore-keys: drama-snapshot-
      - name: Refresh public MyDramaList data
        id: sync
        continue-on-error: true
        run: npm run sync
      - name: Report refresh failure
        if: steps.sync.outcome == 'failure'
        run: echo '::warning::MyDramaList refresh failed. Deploying the last complete snapshot; its sync date remains unchanged.'
      - name: Restore OCR models
        uses: actions/cache@v4
        with:
          path: .cache/tesseract
          key: poster-ocr-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Analyze new poster orientations
        id: posters
        continue-on-error: true
        env:
          REFRESH_POSTERS: ${{ inputs.refresh_posters && '1' || '0' }}
        run: npm run analyze:posters
      - name: Report poster analysis failure
        if: steps.posters.outcome == 'failure'
        run: echo '::warning::Some posters could not be analyzed. Saved results are retained; failed images will be retried on the next run.'
      - run: npm test
      - name: Save poster analysis to the repository
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git diff --quiet -- public/data/posters.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/data/posters.json
            git commit -m 'Update poster orientation analysis [skip ci]'
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
      - uses: actions/cache/save@v4
        if: steps.sync.outcome == 'success'
        with:
          path: public/data/dramas.json
          key: drama-snapshot-${{ github.run_id }}
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
